AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Ephemeral, INTERNAL-ONLY Label Studio host for the model-review experiment.
  Single self-contained stack: every resource it creates is deleted by
  `delete-stack`, so teardown is atomic and verifiable. The instance has NO
  inbound ports open and no public-facing endpoint, DNS, TLS cert, or load
  balancer. You reach Label Studio through an SSM port-forwarding tunnel to
  http://localhost on your own machine. Nothing is created outside this stack.

Parameters:
  Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI (resolved from SSM public parameter).
  InstanceType:
    Type: String
    # t3.small (2GB) is comfortable: LS uses ~270MB idle, image rendering is
    # client-side. t3.micro (1GB) works for light use but add swap. t3.nano OOMs.
    Default: t3.small
  LabelStudioImage:
    Type: String
    Default: heartexlabs/label-studio:1.13.1

Resources:
  # SSM Session Manager is the ONLY access path (shell + port forwarding).
  # No SSH key pair, no inbound security-group rules.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - { Key: Project, Value: model-review }
        - { Key: Ephemeral, Value: "true" }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [ !Ref InstanceRole ]

  # No ingress rules at all -> nothing is reachable from outside the VPC.
  # Egress is left at the SG default (allow-all), which lets the instance pull
  # Docker images and reach the SSM service endpoints over outbound 443.
  # (Customizing SecurityGroupEgress would require an explicit VpcId; the
  # default is exactly what we want, so we omit it and stay VPC-agnostic.)
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: model-review ephemeral Label Studio (NO inbound; SSM only)
      Tags:
        - { Key: Project, Value: model-review }
        - { Key: Ephemeral, Value: "true" }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref Ami
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [ !GetAtt SecurityGroup.GroupId ]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: true   # data volume goes with the instance
      Tags:
        - { Key: Project, Value: model-review }
        - { Key: Ephemeral, Value: "true" }
        - { Key: Name, Value: model-review-label-studio }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          systemctl enable --now docker

          # Accessed only via an SSM tunnel to localhost on the operator's
          # machine, so LABEL_STUDIO_HOST is the local forwarded address.
          # LS runs as uid 1001 inside the container; the bind-mounted host dir
          # must be writable by that uid or LS crash-loops on /data/media.
          mkdir -p /opt/ls_data
          chown -R 1001:1001 /opt/ls_data
          docker run -d --restart unless-stopped --name ls \
            -p 8080:8080 \
            -e LABEL_STUDIO_HOST="http://localhost:8080" \
            -v /opt/ls_data:/label-studio/data \
            ${LabelStudioImage}

Outputs:
  InstanceId:
    Value: !Ref Instance
  PortForwardCommand:
    Description: Run locally (needs the session-manager-plugin) to tunnel LS to localhost:8080.
    Value: !Sub >-
      aws ssm start-session --target ${Instance}
      --document-name AWS-StartPortForwardingSession
      --parameters '{"portNumber":["8080"],"localPortNumber":["8080"]}'
  LocalUrl:
    Description: Open this AFTER the tunnel above is running.
    Value: http://localhost:8080
  ShellCommand:
    Value: !Sub "aws ssm start-session --target ${Instance}"
