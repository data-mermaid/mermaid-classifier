# Training run: coralnet_all_plus_mermaid with a coarser label set. Species
# and labels MERMAID lists in exactly one region are rolled up to their
# nearest ancestor that is neither (or dropped, when that ancestor is an
# excluded label), because v1 fits both poorly.
#
# Everything except the label CSVs, total_annotations and the mlflow block
# matches coralnet_all_plus_mermaid/training_config.yaml, whose run is MLflow
# 4886658aa7cf44f1935af4f0b0fca6b5. That is not the deployed v1 (run
# 8ab6b87e86974841935aa9ad482bc317, an older pipeline at 7.4M), so compare
# against 4886658a for the effect of the label set alone. Regenerate the label CSVs with:
#   uv run python scripts/generate_training_config.py \
#       --output-dir sagemaker/configs/coralnet_all_plus_mermaid_coarse \
#       --roll-up-species --roll-up-region-specific
# then delete the generated sources.csv: the manifest was built from all
# CoralNet sources, as for coralnet_all_plus_mermaid/. README.md lists every
# label whose class changes; its sources.csv line does not apply here.
#
# NOTE: training reads feature vectors from 2605-coralnet-public-sources, so
# every source in the manifest must have its featurevectors present.

dataset:
  include_mermaid: true
  # Verbatim S3 URI of the all-sources manifest parquet
  # (scripts/build_coralnet_manifest.py run with no --sources-csv/--source-ids).
  coralnet_manifest_uri: s3://dev-datamermaid-sm-sources/etl-outputs/coralnet/all/coralnet_classifier_manifest_all.parquet
  # The EfficientNet that produced this run's feature vectors.
  feature_extractor_weights: s3://mermaid-config/classifier/v1/efficientnet_weights.pt
  drop_growthforms: false
  label_rollup_spec_csv: rollups.csv
  included_labels_csv: included_labels.csv
  ref_val_ratios: [0.1, 0.1]
  # Class-balanced subsampling. The per-class cap is total_annotations // K,
  # where K counts the classes with rows after rollup. Run 4886658a had
  # 22.2M // 111 = 200,000. Mapping its subsample/per_class_counts through
  # this rollups.csv gives K = 94, so 200,000 x 94 holds that cap, and the
  # most common classes get no more data than in 4886658a. Check after the
  # run: the largest target_n in subsample/per_class_counts is 200,000.
  subsample:
    strategy: balanced
    total_annotations: 18800000
    min_per_class: 200
  weighting:
    enabled: true
    weight_ratio_cap: 5000.0

training:
  epochs: 40
  early_stopping_patience: 3

mlflow:
  experiment_name: coralnet-all-mermaid-coarse
  model_name: coralnet-all-mermaid-coarse

env:
  # MLFLOW_TRACKING_SERVER is set by the launcher from --mlflow-tracking-uri;
  # do not override here.
  CORALNET_TRAIN_DATA_BUCKET: 2605-coralnet-public-sources
  MERMAID_TRAIN_DATA_BUCKET: coral-reef-training
  # The measured upstream gap is ~7.3% of distinct CoralNet feature vectors
  # (raw images absent upstream — unfixable). The threshold is measured on
  # distinct feature vectors, so "5" would abort the run; "10" tolerates the
  # gap and drops the unbacked annotations.
  TRAINING_INPUTS_PERCENT_MISSING_ALLOWED: "10"
  MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
