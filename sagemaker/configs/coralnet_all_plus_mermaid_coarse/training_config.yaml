# Training run: coarse label set over the pinned coralnet-raw and mermaid
# datasets (every CoralNet group plus every MERMAID image). Species and
# labels MERMAID lists in exactly one region are rolled up to their
# nearest ancestor that is neither (or dropped, when that ancestor is an
# excluded label), because v1 fits both poorly.
#
# The dataset pins match coralnet_all_plus_mermaid/training_config.yaml. The
# comparison baseline should be a run in this same pinned-dataset format, not
# an earlier run that read the retired manifest and feature-bucket data path.
#
# Regenerate the label CSVs and README.md with:
#   uv run python scripts/generate_training_config.py \
#       --output-dir sagemaker/configs/coralnet_all_plus_mermaid_coarse \
#       --roll-up-species --roll-up-region-specific
# then delete the generated groups.csv: with no groups_csv, every group in the
# pinned datasets is used. README.md lists every label whose class changes.
#
# NOTE: images the feature sets do not index count against
# TRAINING_INPUTS_PERCENT_MISSING_ALLOWED below.

dataset:
  # Every CoralNet source (no groups_csv) plus every MERMAID image.
  datasets:
    - name: coralnet-raw
      version: 20261124-5ab21b3
      manifest_sha256: b74e2a9fa32b340e117c0e6f2e0c6fcc64dc1d2df5011778ba0bde76e2568e8b
      features:
        family: efficientnet-v1
        manifest_sha256: c557feffdeb3f89ec82270563b2942d0c4bbe7c976a3568cb92bb91dcfe9935e
      labels: coralnet
    - name: mermaid
      version: 20261124-cfc389d
      manifest_sha256: f7a1495475bcf0feeedfe91230e376233a41a00d22c57209eac8142865b049a8
      features:
        family: efficientnet-v1
        manifest_sha256: f3ca2077a54e4b811877425fd783a6fd14dbc7dd66671da886a9a5bbadc5ac97
      labels: mermaid
  # Resolves the MERMAID dataset's growth-form names to ids.
  taxonomy:
    version: 20261124-e6abfad
    manifest_sha256: fc12b99c119b0151e6fb02ea7bb9870f423bd220764d5f47b57d2305fc3f6b43
  # The EfficientNet that produced this run's feature vectors.
  feature_extractor_weights: s3://mermaid-config/classifier/v1/efficientnet_weights.pt
  drop_growthforms: false
  label_rollup_spec_csv: rollups.csv
  included_labels_csv: included_labels.csv
  ref_val_ratios: [0.1, 0.1]
  # Class-balanced subsampling. The per-class cap is total_annotations // K,
  # where K counts the classes with rows after rollup. The value below is
  # pending a recount of K on the pinned datasets and will be backfilled.
  subsample:
    strategy: balanced
    total_annotations: 18800000
    min_per_class: 200
  weighting:
    enabled: true
    weight_ratio_cap: 5000.0

training:
  epochs: 40
  early_stopping_patience: 3

mlflow:
  experiment_name: coralnet-all-mermaid-coarse
  model_name: coralnet-all-mermaid-coarse

env:
  # MLFLOW_TRACKING_SERVER is set by the launcher from --mlflow-tracking-uri;
  # do not override here.
  # The measured upstream gap is ~7.3% of distinct CoralNet feature vectors
  # (raw images absent upstream — unfixable). The threshold is measured on
  # distinct feature vectors, so "5" would abort the run; "10" tolerates the
  # gap and drops the unbacked annotations.
  TRAINING_INPUTS_PERCENT_MISSING_ALLOWED: "10"
  MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
