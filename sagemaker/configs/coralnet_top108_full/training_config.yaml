# Training run: the 1,216 CoralNet sources in groups.csv, which are the
# sources present in coralnet-raw@20261124-5ab21b3. Uses the same top-108
# benthic-attribute hierarchy as coralnet_top108_best/.
#
# included_labels.csv and rollups.csv are verbatim copies from
# sagemaker/configs/coralnet_top108_best/ (generated 2026-05-08 by
# scripts/generate_training_config.py). Regenerate from the latest
# MERMAID API if the taxonomy has drifted.
#
# Images the feature set does not index count against
# TRAINING_INPUTS_PERCENT_MISSING_ALLOWED="5".

dataset:
  datasets:
    - name: coralnet-raw
      version: 20261124-5ab21b3
      manifest_sha256: b74e2a9fa32b340e117c0e6f2e0c6fcc64dc1d2df5011778ba0bde76e2568e8b
      features:
        family: efficientnet-v1
        manifest_sha256: "<feature-set sha256 after seeding>"
      labels: coralnet
      # Groups (s<source id>) taken from the source ids of the run's former manifest.
      groups_csv: groups.csv
  # The EfficientNet that produced this run's feature vectors.
  feature_extractor_weights: s3://mermaid-config/classifier/v1/efficientnet_weights.pt
  drop_growthforms: false
  label_rollup_spec_csv: rollups.csv
  included_labels_csv: included_labels.csv
  ref_val_ratios: [0.1, 0.1]
  # Class-balanced subsampling. Linear scale from 192-source config:
  # 5,400 annotations/source x 1,370 sources = ~7.4M.
  subsample:
    strategy: balanced
    total_annotations: 7400000
    min_per_class: 200
  weighting:
    enabled: true
    weight_ratio_cap: 5000.0

training:
  epochs: 40
  early_stopping_patience: 3

mlflow:
  experiment_name: coralnet-top108-full-1370sources
  model_name: top108-full-v1

env:
  # MLFLOW_TRACKING_SERVER is set by the launcher from --mlflow-tracking-uri;
  # do not override here.
  TRAINING_INPUTS_PERCENT_MISSING_ALLOWED: "5"
  MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
