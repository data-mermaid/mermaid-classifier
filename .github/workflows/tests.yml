name: Tests

on:
  pull_request:

# Cancel in-progress runs when a PR is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: unittest (Linux, Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install package with training extras
        # The `training` extra carries the full test stack (it includes
        # `[inference]`); this branch split the old `pyspacer` extra into
        # `inference` + `training`.
        # --frozen fails CI if uv.lock is out of sync with pyproject.toml,
        # rather than silently updating it. Keeps CI reproducible.
        run: uv sync --frozen --extra training

      - name: Run tests
        working-directory: tests
        run: uv run --no-sync python -m unittest -v
