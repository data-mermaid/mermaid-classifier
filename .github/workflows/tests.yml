name: Tests

on:
  pull_request:

# Cancel in-progress runs when a PR is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: unittest (Linux, Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Block outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # download.pytorch.org: uv.lock references both pytorch hosts,
          # though only the r2 one appeared in the audit.
          # extensions.duckdb.org:80: httpfs install_extension fallback in
          # pyspacer/dataset.py. Port 80, not 443 -- do not "correct" it.
          # release-assets.githubusercontent.com / objects.githubusercontent.com:
          # cover uv's managed-Python download path, which release-asset
          # requests to github.com redirect to.
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            pypi.org:443
            files.pythonhosted.org:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            extensions.duckdb.org:80
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install package with training and sagemaker extras
        # `training` carries the full test stack and includes `inference`.
        # `sagemaker` adds the SageMaker SDK, which `launch_training.py`
        # imports at module scope: without it, under CI,
        # tests/sagemaker_launcher/test_launch_training.py fails at
        # setUpModule rather than silently skipping its coverage of
        # expand_image_uri and build_estimator_kwargs.
        # --frozen fails CI if uv.lock is out of sync with pyproject.toml,
        # rather than silently updating it. Keeps CI reproducible.
        run: uv sync --frozen --extra training --extra sagemaker

      - name: Run tests
        working-directory: tests
        run: uv run --no-sync python -m unittest -v
