name: Lint

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs when a PR is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff + basedpyright (Linux, Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Block outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # download.pytorch.org: uv.lock references both pytorch hosts,
          # though only the r2 one appeared in the audit.
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            releases.astral.sh:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            pypi.org:443
            files.pythonhosted.org:443
            download.pytorch.org:443
            download-r2.pytorch.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install package with training extras and lint group
        # Real deps must be installed so basedpyright can resolve imports
        # (torch, pyspacer, scikit-learn, mlflow, duckdb, …). `sagemaker` lets
        # basedpyright resolve the SageMaker SDK imported at module scope in
        # scripts/launch_training.py, instead of skipping it as an unresolved
        # import, and it supplies tqdm.
        # --frozen fails CI if uv.lock is out of sync with pyproject.toml.
        run: uv sync --frozen --extra training --extra sagemaker --group lint

      - name: Check lockfile is in sync
        run: uv lock --check

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: basedpyright (strict)
        run: uv run --no-sync basedpyright
